services:
  php8.4:
    image: bzrk/php-stream
    build:
      dockerfile: ./docker/Dockerfile
      args:
        PHP_VERSION: 8.4
    volumes:
      - ./:/app
    command: composer verify

  php8.5:
    image: bzrk/php-stream
    build:
      dockerfile: ./docker/Dockerfile
      args:
        PHP_VERSION: 8.5
    volumes:
      - ./:/app
    command: composer verify